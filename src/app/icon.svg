<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="CJ Private Tutoring">
  <!--
    Browser tab icon. Deliberately the same mark as BrandMark in the header -
    amber disc, navy graduation cap - so the tab and the page read as one thing.
    Colours are the Design.md tokens: --amber-500 and --navy-900.

    Drawn as a filled disc with a stroked cap rather than a detailed logo,
    because this is rendered at 16px in a tab and anything finer turns to mud.
  -->
  <circle cx="16" cy="16" r="16" fill="#F5A623" />
  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#152A5E"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
    <path d="M22 10v6" />
    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
  </g>
</svg>
